require:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.3
  TargetRailsVersion: 8.1
  NewCops: enable

Rails:
  Enabled: true

Bundler/OrderedGems:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

RSpec/NamedSubject:
  Enabled: false

# Rails-generated config stays as generated so upgrades diff cleanly (see doc/rails-upgrades.md).
Layout/SpaceInsideArrayLiteralBrackets:
  Exclude:
    - config/environments/*.rb

Style/GlobalStdStream:
  Exclude:
    - config/environments/*.rb

Style/SymbolArray:
  Exclude:
    - config/initializers/filter_parameter_logging.rb
